# Regenerates the Riftbound dashboard's data and commits it.
#
# Deliberately separate from deploy.yml: the previous MTG generation step was
# removed from the deploy job because a flaky fetch kept blocking the site's
# deploy. The commit this job makes triggers deploy.yml on its own.
name: Refresh Riftbound data

on:
  schedule:
    - cron: '20 9 * * *'
  workflow_dispatch:
    inputs:
      catalog:
        description: 'Also regenerate the card catalogue'
        type: boolean
        default: false

permissions:
  contents: write
  # Needed to dispatch deploy.yml below; a GITHUB_TOKEN push does not trigger
  # workflows on its own, so refreshed data would otherwise never go live.
  actions: write

concurrency:
  group: 'riftbound-data'
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install httpx pytest
      - name: Test card code parsing
        run: pytest scripts/riftbound/tests -q
      - name: Refresh prices
        run: python scripts/riftbound/generate.py --prices
      - name: Refresh catalogue
        if: inputs.catalog
        run: python scripts/riftbound/generate.py --catalog
      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet -- public/riftbound-data; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/riftbound-data
          git commit -m 'Refresh Riftbound data'
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy the refreshed data
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
